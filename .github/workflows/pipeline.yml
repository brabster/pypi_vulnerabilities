on:
  workflow_dispatch: {}
  push: {}
  schedule:
    - cron: '0 4 * * SAT'

env:
  PIP_REQUIRE_VIRTUALENV: true
  DBT_MAX_GIGABYTES_BILLED: ${{ vars.DBT_MAX_GIGABYTES_BILLED }}

jobs:
  refresh-pypi:
    uses: ./.github/workflows/deploy_pypi.yml
    permissions:
      contents: read
      id-token: write
    secrets: inherit

  refresh-semver-udf:
    uses: ./.github/workflows/deploy_semver_udf.yml
    permissions:
      contents: read
      id-token: write
    secrets: inherit

  refresh-safety:
    uses: ./.github/workflows/deploy_safety.yml
    permissions:
      contents: read
      id-token: write
    secrets: inherit
    needs:
      - refresh-semver-udf

