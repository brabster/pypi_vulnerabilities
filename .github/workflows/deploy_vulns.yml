on:
  workflow_dispatch: {}
  workflow_call: {}
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PIP_REQUIRE_VIRTUALENV: true
      DBT_MAX_GIGABYTES_BILLED: ${{ vars.DBT_MAX_GIGABYTES_BILLED }}
    permissions:
        contents: read
        id-token: write
    steps:
      - name: checkout
        uses: actions/checkout@v4
      
      - name: setup_workflow
        uses: ./.github/actions/setup_default_workflow
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      
      - name: refresh_vulns
        uses: ./.github/actions/run_in_venv
        with:
          working-dir: .
          script: |
            dbt run-operation ensure_datasets
            dbt build
            dbt run-operation cleanup --args '{dry_run: False}'

      - name: upload prod pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: target

      - name: deploy prod pages
        uses: actions/deploy-pages@v4
      